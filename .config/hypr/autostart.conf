# Autostart
exec-once = quickshell

# xdg-desktop-portal — required for screen sharing / OBS PipeWire capture
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = sleep 2 && /usr/lib/xdg-desktop-portal-hyprland
exec-once = sleep 3 && /usr/lib/xdg-desktop-portal

exec-once = hypridle
exec-once = nm-applet

# Wallpaper daemon — restore last wallpaper, or fall back to a default
exec-once = awww-daemon
exec-once = sleep 1 && (awww restore || awww img ~/Pictures/Wallpapers/wallpaper4.jpg -t none)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
